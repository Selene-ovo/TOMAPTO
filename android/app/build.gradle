plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
}

def getNaverApiKey() {
    def envFile = file('../../.env')
    if (envFile.exists()) {
        def props = new Properties()
        envFile.withInputStream { props.load(it) }
        def apiKey = props.getProperty('NAVER_API_KEY')
        if (apiKey != null) {
            return apiKey.trim()
        }
    }
    logger.warn('WARNING: NAVER_API_KEY not found in .env file!')
    return ''
}

def naverApiKey = getNaverApiKey()

android {
    namespace 'com.example.tomapto'
    compileSdk 35
    ndkVersion '27.0.12077973'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-Xno-param-assertions',
            '-Xno-call-assertions',
            '-Xno-receiver-assertions'
        ]
    }

    defaultConfig {
        applicationId 'com.example.tomapto'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        
        if (naverApiKey.isEmpty()) {
            logger.warn('Building with empty NAVER_API_KEY - map functionality may not work')
        }
        
        manifestPlaceholders = [
            'NAVER_API_KEY': naverApiKey,
            'applicationName': 'io.flutter.app.FlutterApplication'
        ]
        
        multiDexEnabled true
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    
    packaging {
        resources {
            pickFirsts += ['**/libc++_shared.so', '**/libjsc.so']
        }
    }

    // Flutter APK 자동 복사
    applicationVariants.all { variant ->
        variant.assemble.doLast {
            def buildType = variant.buildType.name
            def flutterApkDir = file("../../build/app/outputs/flutter-apk/")
            def sourceApk = file("build/outputs/apk/${buildType}/app-${buildType}.apk")
            def targetApk = new File(flutterApkDir, "app-${buildType}.apk")
            
            flutterApkDir.mkdirs()
            
            if (sourceApk.exists()) {
                try {
                    targetApk.delete()
                    copy {
                        from sourceApk
                        into flutterApkDir
                        rename { "app-${buildType}.apk" }
                    }
                    Thread.sleep(200)
                } catch (Exception e) {
                    // 복사 실패 시 조용히 무시
                }
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Firebase BOM (최신)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    
    // Core library desugaring (최신)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    
    // Multidex support
    implementation 'androidx.multidex:multidex:2.0.1'
}